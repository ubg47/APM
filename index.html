
<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Anime Pregnant Mother</title>

    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="stylesheet" href="TemplateData/diagnostics.css">

    <script>
        function fetchDebugMode() {
            return new URLSearchParams(window.location.search)
                .get("mirra-sdk-debug") === "true";
        }

        const isDebugModeRequested = fetchDebugMode();
    </script>

    <script src="TemplateData/eruda.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", function () {
            if (isDebugModeRequested && typeof eruda !== "undefined") {
                eruda.init();
            }
        });
    </script>
</head>

<body>

    <div id="unity-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

        <div id="unity-loading-bar">
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>

    <div id="unity-warning"></div>

    <script src="TemplateData/diagnostics.js"></script>

    <script>
        const diagnosticsIcon = document.createElement("img");
        diagnosticsIcon.id = "diagnostics-icon";
        diagnosticsIcon.src = "TemplateData/webmemd-icon.png";
        diagnosticsIcon.style.display = "none";
        document.body.appendChild(diagnosticsIcon);
    </script>

    <script src="TemplateData/game.js"></script>
    <script src="TemplateData/aspectRatio.js"></script>

    <script>
        if (typeof aspectRatio !== "undefined") {
            aspectRatio.init();
        }
    </script>

    <script src="yandexGamesSDK.js"></script>

    <script>
        let unityStarted = false;

        async function startAPM() {
            if (unityStarted) return;
            unityStarted = true;

            console.log("[APM] Starting game...");

            const isYandexEnvironment =
                window.parent !== window &&
                typeof window.YandexGamesSDKEnvironment !== "undefined";

            if (typeof yandexGamesSDK !== "undefined" &&
                typeof yandexGamesSDK.init === "function") {

                if (isYandexEnvironment) {
                    console.log("[APM] Yandex environment detected.");
                } else {
                    console.log("[APM] Enabling standalone SDK...");
                }

                try {
                    await Promise.race([
                        yandexGamesSDK.init(),
                        new Promise((_, reject) =>
                            setTimeout(
                                () => reject(new Error("SDK timeout")),
                                5000
                            )
                        )
                    ]);

                    console.log("[APM] SDK ready.");

                } catch (error) {
                    console.warn("[APM] SDK initialization issue:", error);
                }

            } else {
                console.warn("[APM] SDK wrapper not found. Continuing...");
            }

            // Always start Unity, even if SDK initialization fails.
            console.log("[APM] Starting Unity...");

            try {
                if (typeof game !== "undefined" &&
                    typeof game.init === "function") {

                    game.init();
                    console.log("[APM] Unity initialization requested.");

                } else {
                    console.error("[APM] Unity loader not found!");
                }

            } catch (error) {
                console.error("[APM] Unity startup failed:", error);
            }
        }

        window.addEventListener("load", startAPM, { once: true });
    </script>

</body>
</html>
